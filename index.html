<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root{
    --navy:#143D75; --navy-d:#0e2c56; --red:#C8202E; --gold:#C9933A;
    --ink:#12233d; --mut:#5f7089; --line:#e2e6ec; --bg:#eef1f5; --card:#ffffff;
    --shadow:0 1px 3px rgba(16,38,74,.08),0 6px 18px rgba(16,38,74,.06);
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:var(--bg);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .hidden{display:none!important}

  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg,var(--navy),var(--navy-d));
    color:#fff; padding:calc(env(safe-area-inset-top) + 8px) 12px 10px;
    box-shadow:0 2px 10px rgba(9,26,52,.25);
  }
  .htop{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px}
  header .logo{width:44px;height:44px;border-radius:11px;background:#fff;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  header .logo img{width:40px;height:40px;object-fit:contain}
  .unit{justify-self:end;text-align:right;padding-left:2px}
  .unit small{display:block;font-size:9px;opacity:.75;letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px}
  .unit b{display:block;font-size:16px;line-height:1}
  .callrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .call{
    appearance:none;border:0;cursor:pointer;color:#fff;font-weight:700;font-size:15px;
    border-radius:12px;padding:11px 8px;line-height:1.05;
    display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;
  }
  .call small{font-weight:600;font-size:10px;opacity:.85;letter-spacing:.3px}
  .call.disp{background:#1e5fae;box-shadow:0 2px 0 #123f77}
  .call.mc{background:var(--red);box-shadow:0 2px 0 #8f0f1a}

  .searchwrap{padding:12px 12px 4px}
  .search{position:relative}
  .search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;
    padding:13px 14px 13px 40px;font-size:16px;color:var(--ink);box-shadow:var(--shadow)}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;stroke:var(--mut)}
  .search input:focus{outline:none;border-color:var(--navy)}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:20px 14px;min-height:124px;text-align:center;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    box-shadow:var(--shadow);transition:transform .08s ease;
    -webkit-appearance:none;appearance:none;font:inherit;color:inherit;width:100%}
  .tile:active{transform:scale(.975)}
  .tile .ic{width:42px;height:42px;border-radius:12px;display:flex;
    align-items:center;justify-content:center;background:#eaf0f9;color:var(--navy)}
  .tile .ic svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2}
  .tile .lab{font-size:16px;font-weight:700;line-height:1.15;margin-top:2px}
  .tile .adm{margin-top:2px;font-size:10px;font-weight:700;
    letter-spacing:.5px;text-transform:uppercase;color:var(--gold)}

  .gate{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,var(--navy),var(--navy-d));
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;color:#fff;text-align:center}
  .gate .logo{width:96px;height:96px;border-radius:24px;background:#fff;
    display:flex;align-items:center;justify-content:center;margin-bottom:18px;overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .gate .logo img{width:84px;height:84px;object-fit:contain}
  .gate h1{font-size:20px;margin:0 0 4px}
  .gate p{margin:0 0 22px;opacity:.8;font-size:14px}
  .gate .box{width:100%;max-width:320px}
  .gate input{width:100%;border:0;border-radius:13px;padding:15px;font-size:16px;
    text-align:center;color:var(--ink);margin-bottom:10px}
  .gate button{width:100%;border:0;border-radius:13px;padding:15px;font-size:16px;
    font-weight:700;background:var(--gold);color:#3a2708;cursor:pointer}
  .gate .err{min-height:20px;color:#ffd7d7;font-size:13px;margin-top:10px}
  .gate .load{opacity:.7;font-size:13px;margin-top:14px}

  .signout{display:block;margin:6px auto 26px;background:none;border:0;
    color:var(--mut);font-size:13px;text-decoration:underline;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:#0e2c56;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:80}
  .toast.show{opacity:1;transform:translateX(-50%)}

  .installbar{display:none;align-items:center;gap:10px;margin:12px 12px 0;padding:11px 12px;
    background:#eaf0f9;border:1px solid #cddcf1;border-radius:13px;color:var(--navy)}
  .installbar.show{display:flex}
  .installbar .ib-ic{width:34px;height:34px;border-radius:9px;background:#fff;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .installbar .ib-ic img{width:30px;height:30px;object-fit:contain}
  .installbar .ib-tx{flex:1;font-size:13px;line-height:1.25}
  .installbar .ib-tx b{display:block;font-size:14px}
  .installbar .ib-go{border:0;background:var(--navy);color:#fff;font-weight:700;font-size:13px;
    border-radius:9px;padding:9px 13px;cursor:pointer;flex:0 0 auto}
  .installbar .ib-x{border:0;background:none;color:var(--mut);font-size:20px;line-height:1;
    padding:2px 4px;cursor:pointer;flex:0 0 auto}

  /* ---------- Screen (sub-page) ---------- */
  .screen{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;
    transform:translateX(100%);transition:transform .22s ease;visibility:hidden}
  .screen.open{transform:translateX(0);visibility:visible}
  .scr-head{position:sticky;top:0;background:linear-gradient(180deg,var(--navy),var(--navy-d));
    color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 10px 10px;
    display:flex;align-items:center;gap:6px;box-shadow:0 2px 10px rgba(9,26,52,.25)}
  .scr-head .back{border:0;background:rgba(255,255,255,.14);color:#fff;font-size:15px;font-weight:600;
    border-radius:10px;padding:9px 12px 9px 8px;cursor:pointer;display:flex;align-items:center;gap:3px}
  .scr-head .back svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.4}
  .scr-head h2{font-size:17px;margin:0;font-weight:700}
  .scr-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 30px}
  .scr-search{padding:10px 12px 2px;position:relative;z-index:20}
  .scr-search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;
    padding:12px 14px;font-size:16px;color:var(--ink);box-shadow:var(--shadow)}
  .scr-search input:focus{outline:none;border-color:var(--navy)}

  /* Hospital card */
  .hcard{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;
    box-shadow:var(--shadow);overflow:hidden}
  .hcard-top{padding:14px 14px;cursor:pointer;display:flex;align-items:flex-start;gap:10px}
  .hcard-top .nm{flex:1}
  .hcard-top .nm b{font-size:16px;line-height:1.2;display:block}
  .hcard-top .chev{width:20px;height:20px;stroke:var(--mut);fill:none;stroke-width:2;
    flex:0 0 auto;margin-top:2px;transition:transform .18s}
  .hcard.open .hcard-top .chev{transform:rotate(180deg)}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;background:#eaf0f9;color:var(--navy)}
  .tag.tr{background:#fdeaea;color:var(--red)}
  .tag.pe{background:#eafaf1;color:#1a7a48}
  .hcard-body{display:none;padding:0 14px 14px;border-top:1px solid var(--line);margin-top:2px}
  .hcard.open .hcard-body{display:block}
  .hrow{display:flex;gap:9px;margin-top:12px}
  .hbtn{flex:1;border:0;border-radius:11px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;color:#fff}
  .hbtn svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2}
  .hbtn.call{background:#1a7a48}
  .hbtn.nav{background:#1e5fae}
  .hbtn.red{background:var(--red)}
  .hmeta{margin-top:12px;font-size:13px;color:var(--ink)}
  .hmeta div{margin-top:5px}
  .hmeta .k{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  .hmore{margin-top:10px;background:none;border:0;color:var(--navy);font-weight:700;font-size:13px;
    cursor:pointer;text-decoration:underline;padding:2px 0}
  .hmore-wrap{margin-top:8px}
  .empty{text-align:center;color:var(--mut);padding:40px 20px;font-size:14px}

  .fbar{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;
    padding:8px 12px 4px;scrollbar-width:none}
  .fbar::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);
    font-size:13px;font-weight:600;padding:7px 13px;border-radius:20px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.clr{color:var(--red);border-color:#f0c9cd;background:#fff;font-weight:700}
  .fcount{padding:6px 14px 0;font-size:12px;color:var(--mut)}

  /* Protocols list */
  .cathead{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
    color:var(--mut);margin:16px 4px 7px}
  .plist{display:flex;flex-direction:column;gap:8px}
  .pitem{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 14px;cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
  .pitem b{font-size:15px;font-weight:600;line-height:1.25;flex:1}
  .pitem .go{width:18px;height:18px;stroke:var(--mut);fill:none;stroke-width:2;flex:0 0 auto}
  .phit{font-size:12px;color:var(--mut);margin-top:3px;font-weight:400;display:block}
  /* Protocol reader */
  .preader{position:fixed;inset:0;z-index:45;background:var(--card);display:flex;flex-direction:column;
    transform:translateX(100%);transition:transform .22s ease;visibility:hidden}
  .preader.open{transform:translateX(0);visibility:visible}
  .pr-head-txt{min-width:0;flex:1;text-align:left}
  .pr-head-txt b{display:block;font-size:15px;font-weight:700;color:var(--navy);line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pr-head-txt small{font-size:12px;color:var(--mut)}
  .pr-body{flex:1;overflow:hidden;background:#5b6472;position:relative;touch-action:none}
  .pr-page{position:absolute;top:0;left:0;width:100%;transform-origin:0 0;will-change:transform}
  .pr-page img{width:100%;height:auto;display:block;background:#fff;
    -webkit-user-select:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
  .pr-hint{position:absolute;left:0;right:0;bottom:9px;text-align:center;font-size:11px;color:#fff;
    opacity:.72;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.55);transition:opacity .4s}
  .pr-hint.gone{opacity:0}
  .pr-nav{display:flex;gap:9px;padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);
    border-top:1px solid var(--line);background:#fff}
  .pr-nav button{flex:1;border:1px solid var(--line);background:#fff;color:var(--navy);
    font-weight:700;font-size:14px;border-radius:11px;padding:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:5px}
  .pr-nav button:disabled{opacity:.35}
  .pr-nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4}

  .searchwrap{position:relative;z-index:15}
  .sresults{position:absolute;left:12px;right:12px;top:100%;margin-top:6px;background:#fff;
    border:1px solid var(--line);border-radius:13px;box-shadow:0 10px 30px rgba(16,38,74,.16);
    max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
  .sresults.show{display:block}
  .sr-group{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);
    padding:10px 14px 4px}
  .sr-item{padding:11px 14px;cursor:pointer;border-top:1px solid #f0f2f6;display:flex;align-items:center;gap:9px}
  .sr-item:first-child{border-top:0}
  .sr-item .sic{width:26px;height:26px;border-radius:7px;background:#eaf0f9;color:var(--navy);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .sr-item .sic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
  .sr-item .st{flex:1;min-width:0}
  .sr-item .st b{font-size:14px;font-weight:600;display:block;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sr-item .st span{font-size:11px;color:var(--mut)}
  .sr-empty{padding:16px 14px;color:var(--mut);font-size:13px;text-align:center}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  function isX(v){v=String(v==null?"":v).trim().toLowerCase();return v==="x"||v==="yes"||v==="true"||v==="1";}

  // Minimal RFC-4180 CSV parser (handles quotes, commas, newlines in fields)
  function parseCSV(text){
    var rows=[],row=[],field="",i=0,inQ=false,ch;
    while(i<text.length){
      ch=text[i];
      if(inQ){
        if(ch==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inQ=false;i++;continue; }
        field+=ch;i++;continue;
      }
      if(ch==='"'){inQ=true;i++;continue;}
      if(ch===','){row.push(field);field="";i++;continue;}
      if(ch==="\r"){i++;continue;}
      if(ch==="\n"){row.push(field);field="";rows.push(row);row=[];i++;continue;}
      field+=ch;i++;
    }
    // last field/row
    if(field!==""||row.length){ row.push(field); rows.push(row); }
    return rows;
  }

  function fetchTab(name){

      var rows=parseCSV(t);
      if(!rows.length) return [];
      var keys=rows[0].map(function(k){return String(k==null?"":k).trim();});
      var out=[];
      for(var i=1;i<rows.length;i++){
        var c=rows[i],o={},any=false;
        for(var j=0;j<keys.length;j++){
          if(!keys[j]) continue;
          var v=c[j]!=null?String(c[j]).trim():"";
          o[keys[j]]=v; if(v) any=true;
        }
        if(any) out.push(o);   // skip fully blank rows
      }
      return out;
    });
  }

  var STATE={settings:{},tiles:[],me:null};

  // ---- Protocols (real book pages) ----
  var PROTO={loaded:false, toc:[], pages:[], pos:1, zoom:false, TOTAL:0, pageByN:{}, tocSorted:[]};
  var VOL_ORDER=["General & Policies","Skills & Procedures","Medical & Trauma","Reference & Pharmacology","Other"];
  function pad3(n){ n=""+n; while(n.length<3) n="0"+n; return n; }

  function loadProtocols(){
    return new Promise(function(resolve,reject){
      if(window.HOH_PROTO){ resolve(window.HOH_PROTO); return; }
      var s=document.createElement("script");
      s.src="proto_index.js?v=1";
      s.onload=function(){ window.HOH_PROTO?resolve(window.HOH_PROTO):reject(); };
      s.onerror=reject;
      document.head.appendChild(s);
    });
  }
  function initProto(d){
    if(PROTO.loaded) return;
    PROTO.toc=d.toc||[]; PROTO.pages=d.pages||[]; PROTO.TOTAL=PROTO.pages.length;
    PROTO.pageByN={}; PROTO.pages.forEach(function(p){ PROTO.pageByN[p.n]=p; });
    PROTO.tocSorted=PROTO.toc.slice().sort(function(a,b){ return a.page-b.page; });
    PROTO.loaded=true;
  }
  function protoOwner(n){
    var best=null;
    for(var i=0;i<PROTO.tocSorted.length;i++){
      if(PROTO.tocSorted[i].page<=n) best=PROTO.tocSorted[i]; else break;
    }
    return best;
  }
  function pageLabel(n){ var p=PROTO.pageByN[n]; return (p&&p.l)?p.l:("p."+n); }

  function openProtocols(){
    $("protoScreen").classList.add("open");
    var b=$("protoSres"); if(b){ b.className="sresults"; b.innerHTML=""; }
    if(PROTO.loaded){ renderProto(""); return; }
    $("protoBody").innerHTML='<div class="empty">Loading protocols\u2026</div>';
    loadProtocols().then(function(d){ initProto(d); renderProto(""); })
      .catch(function(){ $("protoBody").innerHTML='<div class="empty">Couldn\'t load protocols. Check your internet and open this again.</div>'; });
  }
  function closeProtocols(){ $("protoScreen").classList.remove("open"); }

  function renderProto(q){
    q=(q||"").trim(); var ql=q.toLowerCase();
    var body=$("protoBody"), cnt=$("protoCount");

    if(!ql){
      // Browse index grouped by volume
      cnt.textContent=PROTO.toc.length+" protocols & sections";
      var groups={}; PROTO.toc.forEach(function(t){ (groups[t.vol]=groups[t.vol]||[]).push(t); });
      var vols=VOL_ORDER.filter(function(v){return groups[v];})
        .concat(Object.keys(groups).filter(function(v){return VOL_ORDER.indexOf(v)<0;}));
      var h="";
      vols.forEach(function(v){
        h+='<div class="cathead">'+esc(v)+'</div><div class="plist">';
        groups[v].forEach(function(t){
          h+='<div class="pitem" data-page="'+t.page+'"><b>'+esc(t.name)+
             '<span class="phit">Page '+esc(t.label)+'</span></b>'+
             '<svg class="go" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>';
        });
        h+='</div>';
      });
      body.innerHTML=h; return;
    }

    // Search: named-protocol hits first, then any page whose text matches
    var seen={}, results=[];
    PROTO.toc.forEach(function(t){
      if(t.name.toLowerCase().indexOf(ql)>-1 && !seen[t.page]){
        seen[t.page]=1; results.push({page:t.page,name:t.name,sub:"Page "+t.label,rank:0});
      }
    });
    PROTO.pages.forEach(function(p){
      if(seen[p.n]) return;
      var i=p.t.toLowerCase().indexOf(ql);
      if(i>-1){
        seen[p.n]=1;
        var o=protoOwner(p.n), st=Math.max(0,i-24);
        var snip="\u2026"+p.t.slice(st,i+ql.length+34).replace(/\s+/g," ").trim()+"\u2026";
        results.push({page:p.n,name:(o?o.name:("Page "+p.l)),sub:snip,rank:1});
      }
    });
    results.sort(function(a,b){ return a.rank-b.rank || a.page-b.page; });
    cnt.textContent=results.length+" result"+(results.length===1?"":"s")+" for \u201C"+q+"\u201D";
    if(!results.length){ body.innerHTML='<div class="empty">No protocols match \u201C'+esc(q)+'\u201D.</div>'; return; }
    var html='<div class="plist">';
    results.slice(0,80).forEach(function(r){
      html+='<div class="pitem" data-page="'+r.page+'"><b>'+esc(r.name)+
            '<span class="phit">'+esc(r.sub)+'</span></b>'+
            '<svg class="go" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>';
    });
    html+='</div>';
    body.innerHTML=html;
  }

  // Reader = real book pages, flips through the whole book, with pinch/pan/double-tap zoom.
  // scale 1 = fit-to-width (page fills width; drag up/down to read). Pinch or double-tap to zoom in.
  var PZ={scale:1,min:1,max:5,tx:0,ty:0,cw:0,ch:0,iw:0,ih:0,
          ptrs:{},nptr:0,g:null,pan:null,lastTap:0,lastX:0,lastY:0};
  var prBody=$("prBody"), prPage=$("prPage"), prImg=$("prImg"), prHint=$("prHint");

  function pzApply(){
    // clamp translation so the page can't be dragged off into empty space
    var dW=PZ.iw*PZ.scale, dH=PZ.ih*PZ.scale;
    if(dW<=PZ.cw) PZ.tx=(PZ.cw-dW)/2; else PZ.tx=Math.min(0,Math.max(PZ.cw-dW,PZ.tx));
    if(dH<=PZ.ch) PZ.ty=(PZ.ch-dH)/2; else PZ.ty=Math.min(0,Math.max(PZ.ch-dH,PZ.ty));
    prPage.style.transform="translate("+PZ.tx+"px,"+PZ.ty+"px) scale("+PZ.scale+")";
    if(prHint){ if(PZ.scale>PZ.min+0.02) prHint.classList.add("gone"); else prHint.classList.remove("gone"); }
  }
  function pzMeasure(){
    PZ.cw=prBody.clientWidth; PZ.ch=prBody.clientHeight;
    PZ.iw=prPage.offsetWidth || PZ.cw;
    PZ.ih=(prImg.naturalWidth? prImg.naturalHeight/prImg.naturalWidth:1.294)*PZ.iw;
  }
  function pzReset(){ PZ.scale=1; PZ.tx=0; PZ.ty=0; pzMeasure(); pzApply(); }
  function pzZoomTo(fx,fy,ns){
    ns=Math.max(PZ.min,Math.min(PZ.max,ns));
    PZ.tx=fx-(fx-PZ.tx)*(ns/PZ.scale);
    PZ.ty=fy-(fy-PZ.ty)*(ns/PZ.scale);
    PZ.scale=ns; pzApply();
  }
  function relXY(e){ var r=prBody.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
  function dist(a,b){ var dx=a.x-b.x,dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }
  function mid(a,b){ return {x:(a.x+b.x)/2,y:(a.y+b.y)/2}; }
  function ptList(){ var a=[]; for(var k in PZ.ptrs) a.push(PZ.ptrs[k]); return a; }

  prBody.addEventListener("pointerdown",function(e){
    prBody.setPointerCapture&&prBody.setPointerCapture(e.pointerId);
    PZ.ptrs[e.pointerId]=relXY(e); PZ.nptr++;
    var pts=ptList();
    if(pts.length===2){
      PZ.g={d:dist(pts[0],pts[1]),s:PZ.scale,m:mid(pts[0],pts[1]),tx:PZ.tx,ty:PZ.ty};
      PZ.pan=null;
    }else if(pts.length===1){
      PZ.pan={x:pts[0].x,y:pts[0].y,tx:PZ.tx,ty:PZ.ty};
    }
  });
  prBody.addEventListener("pointermove",function(e){
    if(!PZ.ptrs[e.pointerId]) return;
    PZ.ptrs[e.pointerId]=relXY(e);
    var pts=ptList();
    if(pts.length===2 && PZ.g){
      var nd=dist(pts[0],pts[1]), m=mid(pts[0],pts[1]);
      var ns=Math.max(PZ.min,Math.min(PZ.max,PZ.g.s*(nd/PZ.g.d)));
      // keep the pinch midpoint anchored, and follow two-finger drag
      PZ.tx=PZ.g.m.x-(PZ.g.m.x-PZ.g.tx)*(ns/PZ.g.s)+(m.x-PZ.g.m.x);
      PZ.ty=PZ.g.m.y-(PZ.g.m.y-PZ.g.ty)*(ns/PZ.g.s)+(m.y-PZ.g.m.y);
      PZ.scale=ns; pzApply();
      e.preventDefault();
    }else if(pts.length===1 && PZ.pan){
      PZ.tx=PZ.pan.tx+(pts[0].x-PZ.pan.x);
      PZ.ty=PZ.pan.ty+(pts[0].y-PZ.pan.y);
      pzApply(); e.preventDefault();
    }
  },{passive:false});
  function pzUp(e){
    if(PZ.ptrs[e.pointerId]){ delete PZ.ptrs[e.pointerId]; PZ.nptr=Math.max(0,PZ.nptr-1); }
    var pts=ptList();
    if(pts.length<2) PZ.g=null;
    if(pts.length===1){ PZ.pan={x:pts[0].x,y:pts[0].y,tx:PZ.tx,ty:PZ.ty}; }
    if(pts.length===0){
      PZ.pan=null;
      // double-tap detection
      var t=Date.now(), p=relXY(e);
      if(t-PZ.lastTap<300 && Math.abs(p.x-PZ.lastX)<30 && Math.abs(p.y-PZ.lastY)<30){
        if(PZ.scale>PZ.min+0.02) pzReset(); else pzZoomTo(p.x,p.y,2.6);
        PZ.lastTap=0;
      }else{ PZ.lastTap=t; PZ.lastX=p.x; PZ.lastY=p.y; }
    }
  }
  prBody.addEventListener("pointerup",pzUp);
  prBody.addEventListener("pointercancel",pzUp);

  // Desktop: wheel / two-finger scroll pans the page; Ctrl+wheel (or trackpad pinch) zooms.
  prBody.addEventListener("wheel",function(e){
    if(!$("protoReader").classList.contains("open")) return;
    e.preventDefault();
    if(e.ctrlKey){
      var r=prBody.getBoundingClientRect();
      pzZoomTo(e.clientX-r.left, e.clientY-r.top, PZ.scale*Math.exp(-e.deltaY*0.0025));
    }else{
      PZ.tx-=e.deltaX; PZ.ty-=e.deltaY; pzApply();
    }
  },{passive:false});

  function openReaderPage(n){ $("protoReader").classList.add("open"); showPage(n); }
  function showPage(n){
    if(!PROTO.TOTAL) return;
    n=Math.max(1,Math.min(PROTO.TOTAL,n)); PROTO.pos=n;
    var o=protoOwner(n);
    $("prTitle").textContent=o?o.name:"Protocols";
    $("prCat").textContent="Page "+pageLabel(n)+"  \u00B7  "+n+" / "+PROTO.TOTAL;
    prImg.onload=function(){ pzReset(); };
    prImg.src="protocols/p"+pad3(n)+".webp";
    if(prHint) prHint.classList.remove("gone");
    $("prPrev").disabled=n<=1; $("prNext").disabled=n>=PROTO.TOTAL;
    [n-1,n+1].forEach(function(m){ if(m>=1&&m<=PROTO.TOTAL){ var im=new Image(); im.src="protocols/p"+pad3(m)+".webp"; } });
  }
  function closeReader(){ $("protoReader").classList.remove("open"); }
  function zoomBtn(){ if(PZ.scale>PZ.min+0.02) pzReset(); else pzZoomTo(PZ.cw/2,PZ.ch*0.32,2.6); }

  window.addEventListener("resize",function(){ if($("protoReader").classList.contains("open")){ pzMeasure(); pzApply(); } });

  $("protoBody").addEventListener("click",function(e){
    var it=e.target.closest?e.target.closest(".pitem"):null;
    if(it){ openReaderPage(parseInt(it.getAttribute("data-page"),10)); }
  });
  $("protoBack").addEventListener("click",closeProtocols);
  $("protoReadBack").addEventListener("click",closeReader);
  $("prPrev").addEventListener("click",function(){ showPage(PROTO.pos-1); });
  $("prNext").addEventListener("click",function(){ showPage(PROTO.pos+1); });
  $("prZoom").addEventListener("click",zoomBtn);
  // Protocols screen search = same tappable dropdown as the home page
  function renderProtoDropdown(q){
    var box=$("protoSres");
    q=(q||"").trim(); var ql=q.toLowerCase();
    if(!ql){ box.className="sresults"; box.innerHTML=""; renderProto(""); return; }
    var pro=[], seen={};
    (PROTO.toc||[]).forEach(function(t){
      if(t.name.toLowerCase().indexOf(ql)>-1 && !seen[t.page]){
        seen[t.page]=1; pro.push({page:t.page,name:t.name,sub:"Page "+t.label,rank:0}); }
    });
    (PROTO.pages||[]).forEach(function(p){
      if(seen[p.n]) return;
      var i=p.t.toLowerCase().indexOf(ql);
      if(i>-1){ seen[p.n]=1; var o=protoOwner(p.n);
        var st=Math.max(0,i-20), snip="\u2026"+p.t.slice(st,i+ql.length+30).replace(/\s+/g," ").trim()+"\u2026";
        pro.push({page:p.n,name:(o?o.name:("Page "+p.l)),sub:snip,rank:1}); }
    });
    pro.sort(function(a,b){ return a.rank-b.rank || a.page-b.page; });
    pro=pro.slice(0,40);
    $("protoCount").textContent=pro.length?(pro.length+" result"+(pro.length===1?"":"s")+" for \u201C"+q+"\u201D"):"";
    var html="";
    if(!pro.length){ html='<div class="sr-empty">No protocols match \u201C'+esc(q)+'\u201D</div>'; }
    else pro.forEach(function(p){
      html+='<div class="sr-item" data-page="'+p.page+'"><div class="sic">'+ICO_PROTO+'</div>'+
        '<div class="st"><b>'+esc(p.name)+'</b><span>'+esc(p.sub)+'</span></div></div>';
    });
    box.innerHTML=html; box.className="sresults show";
  }
  function hideProtoDropdown(){ var b=$("protoSres"); if(b){ b.className="sresults"; b.innerHTML=""; } }

  $("protoSearch").addEventListener("input",function(){
    var v=this.value;
    var go=function(){ renderProtoDropdown(v); };
    if(!PROTO.loaded){ loadProtocols().then(function(d){ initProto(d); go(); }).catch(function(){}); }
    else go();
  });
  $("protoSres").addEventListener("click",function(e){
    var it=e.target.closest?e.target.closest(".sr-item"):null; if(!it) return;
    hideProtoDropdown();
    openReaderPage(parseInt(it.getAttribute("data-page"),10));
  });
  // tap anywhere on the protocols screen outside the search closes the dropdown
  $("protoScreen").addEventListener("click",function(e){
    if(!e.target.closest || !e.target.closest(".scr-search")) hideProtoDropdown();
  });

  // ---- Install banner ----
  (function(){
    var bar=$("installbar"), go=$("ibGo"), x=$("ibX"), sub=$("ibSub");
    var deferred=null;
    function standalone(){
      return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone===true;
    }
    function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }
    function showBar(){ if(!standalone()) bar.classList.add("show"); }
    function hideBar(){ bar.classList.remove("show"); }

    // X only hides for this view; it returns on next refresh/login until installed
    x.addEventListener("click", hideBar);

    // Android / Chromium: capture the real install prompt
    window.addEventListener("beforeinstallprompt",function(e){
      e.preventDefault(); deferred=e; go.style.display=""; go.textContent="Install"; showBar();
    });
    go.addEventListener("click",function(){
      if(deferred){
        deferred.prompt();
        deferred.userChoice.then(function(){ deferred=null; hideBar(); });
      }else if(isIOS()){
        sub.textContent="Tap the Share button, then \u201CAdd to Home Screen.\u201D";
        go.style.display="none";
      }
    });

    // Once installed, hide immediately and it won't come back (standalone check)
    window.addEventListener("appinstalled", hideBar);

    // iOS never fires beforeinstallprompt: show manual steps each visit until installed
    if(isIOS() && !standalone()){
      sub.textContent="Tap Share, then \u201CAdd to Home Screen.\u201D";
      go.style.display="none";
      showBar();
    }
  })();

  // ---- PWA service worker ----
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
