<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#143D75">
<title>Hatzalah of Houston</title>
<style>
  :root{
    --navy:#143D75; --navy-d:#0e2c56; --red:#C8202E; --gold:#C9933A;
    --ink:#12233d; --mut:#5f7089; --line:#e2e6ec; --bg:#eef1f5; --card:#ffffff;
    --shadow:0 1px 3px rgba(16,38,74,.08),0 6px 18px rgba(16,38,74,.06);
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:var(--bg);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .hidden{display:none!important}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg,var(--navy),var(--navy-d));
    color:#fff; padding:calc(env(safe-area-inset-top) + 8px) 12px 10px;
    display:grid; grid-template-columns:44px 1fr 44px; align-items:center; gap:8px;
    box-shadow:0 2px 10px rgba(9,26,52,.25);
  }
  header .logo{width:44px;height:44px;border-radius:11px;background:#fff;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  header .logo img{width:40px;height:40px;object-fit:contain}
  .mc{
    appearance:none;border:0;cursor:pointer;
    background:var(--red);color:#fff;font-weight:700;font-size:15px;
    border-radius:12px;padding:11px 10px;line-height:1.05;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    box-shadow:0 2px 0 #8f0f1a; width:100%;
  }
  .mc small{font-weight:600;font-size:10px;opacity:.85;letter-spacing:.3px}
  .unit{justify-self:end;text-align:right}
  .unit b{display:block;font-size:15px;line-height:1}
  .unit small{font-size:9px;opacity:.75;letter-spacing:.5px;text-transform:uppercase}

  /* ---------- Search ---------- */
  .searchwrap{padding:12px 12px 4px}
  .search{position:relative}
  .search input{
    width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;
    padding:13px 14px 13px 40px;font-size:16px;color:var(--ink);
    box-shadow:var(--shadow);
  }
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;stroke:var(--mut)}
  .search input:focus{outline:none;border-color:var(--navy)}

  /* ---------- Tiles ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
  .tile{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:18px 16px;min-height:118px;text-align:left;cursor:pointer;
    display:flex;flex-direction:column;justify-content:space-between;
    box-shadow:var(--shadow);transition:transform .08s ease;
    -webkit-appearance:none;appearance:none;font:inherit;color:inherit;width:100%;
  }
  .tile:active{transform:scale(.975)}
  .tile .ic{width:42px;height:42px;border-radius:12px;display:flex;
    align-items:center;justify-content:center;background:#eaf0f9;color:var(--navy)}
  .tile .ic svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2}
  .tile .lab{font-size:16px;font-weight:700;line-height:1.15;margin-top:12px}
  .tile .adm{align-self:flex-start;margin-top:6px;font-size:10px;font-weight:700;
    letter-spacing:.5px;text-transform:uppercase;color:var(--gold)}

  /* ---------- Login ---------- */
  .gate{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,var(--navy),var(--navy-d));
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;color:#fff;text-align:center}
  .gate .logo{width:96px;height:96px;border-radius:24px;background:#fff;
    display:flex;align-items:center;justify-content:center;margin-bottom:18px;overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .gate .logo img{width:84px;height:84px;object-fit:contain}
  .gate h1{font-size:20px;margin:0 0 4px}
  .gate p{margin:0 0 22px;opacity:.8;font-size:14px}
  .gate .box{width:100%;max-width:320px}
  .gate input{width:100%;border:0;border-radius:13px;padding:15px;font-size:16px;
    text-align:center;color:var(--ink);margin-bottom:10px}
  .gate button{width:100%;border:0;border-radius:13px;padding:15px;font-size:16px;
    font-weight:700;background:var(--gold);color:#3a2708;cursor:pointer}
  .gate .err{min-height:20px;color:#ffd7d7;font-size:13px;margin-top:10px}
  .gate .load{opacity:.7;font-size:13px;margin-top:14px}

  /* ---------- misc ---------- */
  .signout{display:block;margin:6px auto 26px;background:none;border:0;
    color:var(--mut);font-size:13px;text-decoration:underline;cursor:pointer}
  .stub{padding:40px 20px;text-align:center;color:var(--mut)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:#0e2c56;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:80}
  .toast.show{opacity:1;transform:translateX(-50%)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(function(){
  "use strict";
  var SHEET_ID = "1gM1ndlnuKvQK8JvM_STUyrG8XbAl0W5IQk10EQTF98o";
  var LS = "hoh_member_v1";

  // --- helpers ---
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
  function toast(m){var t=$("toast");t.textContent=m;t.className="toast show";
    setTimeout(function(){t.className="toast";},1600);}

  // Fetch a tab via Google Visualization API -> rows of objects keyed by header
  function fetchTab(name){
    var url="https://docs.google.com/spreadsheets/d/"+SHEET_ID+
            "/gviz/tq?tqx=out:json&sheet="+encodeURIComponent(name);
    return fetch(url).then(function(r){return r.text();}).then(function(t){
      var s=t.indexOf("{"), e=t.lastIndexOf("}");
      var data=JSON.parse(t.slice(s,e+1));
      var cols=(data.table.cols||[]).map(function(c){return (c.label||"").trim();});
      // if header labels are blank, gviz put them in first row — handle both
      var rows=data.table.rows||[];
      var out=[];
      var headerFromRow = cols.every(function(c){return !c;});
      var startAt=0, keys=cols;
      if(headerFromRow && rows.length){
        keys=(rows[0].c||[]).map(function(c){return c&&c.v!=null?String(c.v).trim():"";});
        startAt=1;
      }
      for(var i=startAt;i<rows.length;i++){
        var c=rows[i].c||[], o={};
        for(var j=0;j<keys.length;j++){ if(keys[j]) o[keys[j]] = c[j]&&c[j].v!=null? c[j].v : ""; }
        out.push(o);
      }
      return out;
    });
  }

  var STATE={settings:{},tiles:[],me:null};

  function getSetting(k,def){ return STATE.settings[k]!=null && STATE.settings[k]!=="" ? STATE.settings[k] : def; }

  // ---------- LOGIN ----------
  function tryLogin(pw){
    $("pwErr").textContent=""; $("pwLoad").classList.remove("hidden");
    return fetchTab("Members").then(function(rows){
      var hit=null;
      for(var i=0;i<rows.length;i++){
        var r=rows[i];
        var active=String(r["Active"]||"").trim().toLowerCase();
        var isActive = active===""||active==="x"||active==="yes"||active==="true";
        if(!isActive) continue;
        if(String(r["Password"]||"").trim()===pw.trim()){ hit=r; break; }
      }
      $("pwLoad").classList.add("hidden");
      if(!hit){ $("pwErr").textContent="Password not recognized. Check with your coordinator."; return false; }
      var me={
        last:r_(hit,"Last Name"), first:r_(hit,"First Name"),
        unit:r_(hit,"Unit"), admin:isX(hit["Admin"]), pw:pw.trim()
      };
      localStorage.setItem(LS, JSON.stringify(me));
      STATE.me=me;
      return true;
    }).catch(function(){
      $("pwLoad").classList.add("hidden");
      $("pwErr").textContent="Couldn't reach the roster. Check your internet and try again.";
      return false;
    });
  }
  function r_(o,k){return String(o[k]==null?"":o[k]).trim();}
  function isX(v){v=String(v==null?"":v).trim().toLowerCase();return v==="x"||v==="yes"||v==="true"||v==="1";}

  // ---------- ICONS ----------
  var ICONS={
    clipboard:'<path d="M9 3h6a1 1 0 011 1v1H8V4a1 1 0 011-1z"/><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 11h6M9 15h4"/>',
    hospital:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 8v8M8 12h8"/>',
    book:'<path d="M5 5a2 2 0 012-2h11v16H7a2 2 0 00-2 2z"/><path d="M5 19a2 2 0 012-2h11"/>',
    grid:'<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>',
    check:'<path d="M20 6L9 17l-5-5"/>',
    link:'<path d="M10 14a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1"/><path d="M14 10a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/>'
  };
  function icon(name){return ICONS[name]||ICONS.link;}

  // ---------- RENDER ----------
  function boot(){
    return Promise.all([fetchTab("Settings"), fetchTab("Tiles")]).then(function(res){
      var setRows=res[0], tileRows=res[1];
      STATE.settings={};
      setRows.forEach(function(r){ var k=r_(r,"Setting"); if(k) STATE.settings[k]=String(r["Value"]==null?"":r["Value"]).trim(); });

      STATE.tiles = tileRows.filter(function(t){
        var lab=r_(t,"Label"); if(!lab) return false;
        var act=String(t["Active"]||"").trim().toLowerCase();
        return act===""||act==="x"||act==="yes"||act==="true";
      }).sort(function(a,b){ return (parseFloat(a["Order"])||99)-(parseFloat(b["Order"])||99); });

      paintHeader(); paintTiles();
    });
  }

  function paintHeader(){
    $("unit").textContent = STATE.me.unit || "—";
    $("mcLabel").textContent = getSetting("Medical Control Label","Call Medical Control");
    $("gateOrg").textContent = getSetting("Org Name","Hatzalah of Houston");
    $("search").placeholder = getSetting("Search Placeholder","Search…");
  }

  function paintTiles(){
    var g=$("grid"); g.innerHTML="";
    STATE.tiles.forEach(function(t){
      var adminOnly=isX(t["Admin Only"]);
      if(adminOnly && !STATE.me.admin) return;   // hide from non-admins
      var b=document.createElement("button");
      b.className="tile";
      b.innerHTML='<div class="ic"><svg viewBox="0 0 24 24">'+icon(r_(t,"Icon"))+'</svg></div>'+
                  '<div><div class="lab">'+esc(r_(t,"Label"))+'</div>'+
                  (adminOnly?'<div class="adm">Admin</div>':'')+'</div>';
      b.addEventListener("click",function(){ openTile(t); });
      g.appendChild(b);
    });
  }

  function openTile(t){
    var type=r_(t,"Type").toLowerCase();
    if(type==="link"){
      var url=r_(t,"Target"); if(url){ window.open(url,"_blank","noopener"); }
      else toast("No link set for this tile.");
      return;
    }
    // built-in screens are added in the next steps
    toast('"'+r_(t,"Label")+'" is being added next.');
  }

  // ---------- MEDICAL CONTROL ----------
  $("mcBtn").addEventListener("click",function(){
    var num=getSetting("Medical Control Number","");
    if(!num){ toast("No medical control number set."); return; }
    window.location.href="tel:"+num.replace(/\s+/g,"");
  });

  // ---------- events ----------
  $("pwBtn").addEventListener("click",doLogin);
  $("pw").addEventListener("keydown",function(e){ if(e.key==="Enter") doLogin(); });
  function doLogin(){
    var pw=$("pw").value; if(!pw){ $("pwErr").textContent="Enter your password."; return; }
    tryLogin(pw).then(function(ok){ if(ok) enter(); });
  }
  $("signout").addEventListener("click",function(){
    if(confirm("Sign out on this device? You'll need your password to get back in.")){
      localStorage.removeItem(LS); location.reload();
    }
  });

  function enter(){
    $("gate").classList.add("hidden");
    $("app").classList.remove("hidden");
    boot().catch(function(){ toast("Couldn't load the app. Check your internet."); });
  }

  // ---------- start ----------
  var saved=null;
  try{ saved=JSON.parse(localStorage.getItem(LS)||"null"); }catch(e){}
  var remember=true; // Settings 'Remember Device' can turn off; default on
  if(saved && saved.pw){
    STATE.me=saved; enter();
  }else{
    setTimeout(function(){ $("pw").focus(); }, 200);
  }
})();
</script>
</body>
</html>
