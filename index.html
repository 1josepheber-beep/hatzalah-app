    --shadow:0 1px 3px rgba(16,38,74,.08),0 6px 18px rgba(16,38,74,.06);
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:var(--bg);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .hidden{display:none!important}

  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg,var(--navy),var(--navy-d));
    color:#fff; padding:calc(env(safe-area-inset-top) + 8px) 12px 10px;
    box-shadow:0 2px 10px rgba(9,26,52,.25);
  }
  .htop{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px}
  header .logo{width:44px;height:44px;border-radius:11px;background:#fff;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  header .logo img{width:40px;height:40px;object-fit:contain}
  .unit{justify-self:end;text-align:right;padding-left:2px}
  .unit small{display:block;font-size:9px;opacity:.75;letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px}
  .unit b{display:block;font-size:16px;line-height:1}
  .callrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .rstatus{justify-self:center;display:inline-flex;align-items:center;gap:8px;
    padding:7px 16px;border-radius:999px;font-weight:800;font-size:15px;letter-spacing:.5px;
    text-transform:uppercase;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap;line-height:1}
  .rstatus .dot{width:11px;height:11px;border-radius:50%;background:#fff;flex:0 0 auto}
  .rstatus.primary{background:rgba(38,166,91,.26);color:#e2ffef}
  .rstatus.primary .dot{background:#37d67a}
  .rstatus.backup{background:rgba(201,147,58,.28);color:#ffedd0}
  .rstatus.backup .dot{background:#f2b04a}
  .rstatus.observer{background:rgba(255,255,255,.18);color:#eef2f8}
  .rstatus.observer .dot{background:#c3ccda}
  .call{
    appearance:none;border:0;cursor:pointer;color:#fff;font-weight:700;font-size:15px;
    border-radius:12px;padding:11px 8px;line-height:1.05;
    display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;
  }
  .call small{font-weight:600;font-size:10px;opacity:.85;letter-spacing:.3px}
  .call.disp{background:#1e5fae;box-shadow:0 2px 0 #123f77}
  .call.mc{background:var(--red);box-shadow:0 2px 0 #8f0f1a}

  .searchwrap{padding:12px 12px 4px}
  .search{position:relative}
  .search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;
    padding:13px 14px 13px 40px;font-size:16px;color:var(--ink);box-shadow:var(--shadow)}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;stroke:var(--mut)}
  .search input:focus{outline:none;border-color:var(--navy)}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:20px 14px;min-height:124px;text-align:center;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    box-shadow:var(--shadow);transition:transform .08s ease;
    -webkit-appearance:none;appearance:none;font:inherit;color:inherit;width:100%}
  .tile:active{transform:scale(.975)}
  .tile .ic{width:42px;height:42px;border-radius:12px;display:flex;
    align-items:center;justify-content:center;background:#eaf0f9;color:var(--navy)}
  .tile .ic svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2}
  .tile.imgtile{padding:0;overflow:hidden;position:relative;justify-content:flex-end}
  .tile.imgtile img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .tile.imgtile .lab{position:relative;z-index:2;width:100%;margin:0;color:#fff;padding:26px 10px 12px;
    background:linear-gradient(to top,rgba(6,16,34,.85),rgba(6,16,34,.15) 68%,rgba(6,16,34,0))}
  .tile.imgtile .adm{position:absolute;top:8px;right:8px;z-index:3;margin:0;
    background:rgba(0,0,0,.55);color:#ffcf7a;padding:2px 8px;border-radius:6px}

  /* Product Placement */
  .cab-grid{padding:12px;display:grid;grid-template-columns:1fr;gap:12px}
  .cab-card{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:10px;box-shadow:var(--shadow);cursor:pointer;width:100%;
    -webkit-appearance:none;appearance:none;font:inherit;color:inherit;text-align:left}
  .cab-card:active{transform:scale(.99)}
  .cab-card img{width:104px;height:76px;object-fit:cover;border-radius:10px;flex:0 0 auto;background:#5b6472}
  .cab-card .cc-nm{font-weight:700;font-size:16px;color:var(--ink)}
  .cab-card .cc-ct{color:var(--mut);font-size:13px;margin-top:3px}
  .cab-photo-wrap{position:relative;overflow:auto;background:#5b6472;max-height:46vh;
    -webkit-overflow-scrolling:touch}
  .cab-photo{position:relative;width:100%;font-size:0;transition:width .15s}
  .cab-photo.zoom{width:230%}
  .cab-photo img{width:100%;display:block}
  .cbin{position:absolute;border:2px solid rgba(255,255,255,.72);border-radius:6px;box-sizing:border-box;
    cursor:pointer;background:rgba(30,95,174,.08)}
  .cbin .cbadge{position:absolute;top:-8px;left:-8px;min-width:17px;height:17px;padding:0 3px;border-radius:9px;
    background:var(--navy);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;
    justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .cbin .cchip{display:none;position:absolute;left:50%;bottom:100%;transform:translateX(-50%);
    white-space:nowrap;background:var(--red);color:#fff;font-size:11px;font-weight:600;padding:2px 7px;
    border-radius:5px;margin-bottom:4px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .cbin.sel{border-color:var(--red);background:rgba(200,32,46,.22);box-shadow:0 0 0 2px rgba(200,32,46,.45)}
  .cbin.sel .cbadge{background:var(--red)}
  .cbin.sel .cchip{display:block}
  .cab-zoom{position:absolute;right:10px;bottom:10px;z-index:5;border:0;cursor:pointer;
    background:rgba(9,26,52,.82);color:#fff;font-weight:700;font-size:13px;padding:8px 14px;border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .cab-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 10px 26px}
  .cab-ord{display:flex;gap:5px;align-items:center;flex:0 0 auto}
  .ebtn.ord{padding:9px 11px;font-size:13px;line-height:1;font-weight:800}
  .cirow{display:flex;align-items:center;gap:11px;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer}
  .cirow:active{background:#f2f5fa}
  .cirow.sel{background:#eaf0f9}
  .cinum{width:23px;height:23px;border-radius:7px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;
    display:grid;place-items:center;flex:0 0 auto}
  .cirow.sel .cinum{background:var(--red)}
  .ciname{flex:1;font-weight:600;color:var(--ink);font-size:15px}
  .ciqty{color:var(--mut);font-size:13px;font-weight:600;flex:0 0 auto}
  /* Equipment Finder — admin editor */
  .hbtn{margin-left:auto;border:0;cursor:pointer;background:rgba(255,255,255,.16);color:#fff;
    font-weight:700;font-size:14px;padding:8px 14px;border-radius:9px}
  .hbtn.on{background:var(--gold);color:#1a1205}
  .edit-bar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;background:#eef2f8;
    border-bottom:1px solid var(--line)}
  .ebtn{border:1px solid var(--line);cursor:pointer;background:#fff;color:var(--ink);font-weight:700;
    font-size:13px;padding:9px 13px;border-radius:9px}
  .ebtn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
  .ebtn.danger{background:#fff;color:var(--red);border-color:var(--red)}
  .cbin .rsz{position:absolute;right:-8px;bottom:-8px;width:20px;height:20px;border-radius:50%;
    background:var(--navy);border:2px solid #fff;display:none;cursor:se-resize;touch-action:none}
  .cab-photo.editing .cbin{cursor:move}
  .cab-photo.editing .cbin.sel .rsz{display:block}
  .cab-photo.editing .cbin{touch-action:none}
  .modal-wrap{position:fixed;inset:0;z-index:70;background:rgba(9,20,40,.55);display:flex;
    align-items:center;justify-content:center;padding:20px}
  .modal{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:360px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
  .modal h3{margin:0 0 12px;font-size:17px}
  .modal label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:12px}
  .modal input{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;
    font-size:16px;color:var(--ink)}
  .modal input:focus{outline:none;border-color:var(--navy)}
  .modal select{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;
    font-size:16px;color:var(--ink);background:#fff}
  .modal-btns{display:flex;align-items:center;gap:8px;margin-top:4px}

  /* Required Equipment */
  .eq-tools{padding:10px 12px 6px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:10}
  .eq-tools>input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;
    padding:11px 13px;font-size:16px;color:var(--ink)}
  .eq-tools>input:focus{outline:none;border-color:var(--navy)}
  .eq-chips{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
  .eq-chip{border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:12.5px;
    padding:6px 12px;border-radius:999px;cursor:pointer}
  .eq-chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .eq-progwrap{display:flex;align-items:center;gap:10px;margin-top:9px}
  .eq-prog{flex:1;font-size:13px;font-weight:700;color:var(--navy)}
  .eq-exports{display:flex;gap:6px}
  .eq-cat{border-bottom:1px solid var(--line)}
  .eq-cat-h{display:flex;align-items:center;gap:8px;padding:12px;background:#f2f5fa;cursor:pointer;
    font-weight:800;font-size:14px;color:var(--navy);position:sticky;top:0}
  .eq-cat-h .cnt{margin-left:auto;font-size:12px;color:var(--mut);font-weight:700}
  .eq-cat-h .car{width:16px;height:16px;stroke:var(--navy);fill:none;stroke-width:2.4;transition:transform .15s}
  .eq-cat.collapsed .car{transform:rotate(-90deg)}
  .eq-cat.collapsed .eq-items{display:none}
  .eq-item{display:flex;gap:11px;padding:11px 12px;border-top:1px solid var(--line);align-items:flex-start}
  .eq-item:first-child{border-top:0}
  .eq-cb{width:23px;height:23px;flex:0 0 auto;border:2px solid var(--line);border-radius:6px;cursor:pointer;
    display:grid;place-items:center;margin-top:1px;background:#fff}
  .eq-cb.on{background:var(--navy);border-color:var(--navy)}
  .eq-cb svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:3;display:none}
  .eq-cb.on svg{display:block}
  .eq-main{flex:1;min-width:0}
  .eq-nm{font-weight:600;font-size:15px;color:var(--ink);line-height:1.25}
  .eq-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
  .eq-badge{font-size:10px;font-weight:800;letter-spacing:.4px;padding:2px 7px;border-radius:6px;text-transform:uppercase}
  .eq-badge.bls{background:#e4f0e6;color:#1f7a37}
  .eq-badge.als{background:#e5edfa;color:#1e5fae}
  .eq-badge.micu{background:#f3e6f7;color:#8a2ea3}
  .eq-src{font-size:10px;font-weight:700;color:var(--mut);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
  .eq-qty{font-size:12px;color:var(--mut);font-weight:600}
  .eq-ours{font-size:12.5px;color:var(--mut);margin-top:3px}
  .eq-note{font-size:12.5px;color:var(--navy);margin-top:3px;font-style:italic}
  .eq-subs{margin-top:7px;display:flex;flex-direction:column;gap:6px}
  .eq-sub{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink)}
  .eq-sub .eq-cb{width:19px;height:19px}
  .eq-sub .eq-cb svg{width:12px;height:12px}
  .eq-edit-hint{margin-left:auto;color:var(--navy);font-size:12px;font-weight:700;flex:0 0 auto}
  #printArea{display:none}
  .eq-frame{flex:1;width:100%;border:0;background:#fff}
  /* File Upload */
  .up-body{flex:1;overflow-y:auto;padding:16px 14px 30px}
  .up-intro{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:12px}
  .up-list{display:flex;flex-direction:column;gap:10px}
  .up-type{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);
    border-radius:13px;padding:15px 16px;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;
    box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
  .up-type:active{transform:scale(.99)}
  .up-type::before{content:"\1F4CE";font-size:17px}
  .up-step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;
    margin-top:12px;box-shadow:var(--shadow)}
  .up-step-h{font-size:15px;color:var(--ink);margin-bottom:14px}
  .up-name{font-size:14px;color:var(--mut);font-weight:600;line-height:1.5}
  .up-fname{display:inline-block;margin-top:6px;font-size:19px;font-weight:800;color:var(--navy);
    background:#eaf0f9;padding:8px 14px;border-radius:10px;letter-spacing:.3px}
  .up-copy{margin-left:8px;font-size:12px;font-weight:700;color:var(--navy);background:transparent;
    border:1px solid var(--navy);border-radius:8px;padding:6px 10px;cursor:pointer;vertical-align:middle}
  .up-note{font-size:13px;color:var(--mut);margin:14px 0 16px;line-height:1.5}
  .up-open{width:100%;font-size:16px;padding:14px}

  /* Certifications */
  .tile{position:relative}
  @keyframes cpr{0%,100%{box-shadow:0 0 0 0 rgba(200,32,46,.5)}50%{box-shadow:0 0 0 7px rgba(200,32,46,0)}}
  @keyframes cpo{0%,100%{box-shadow:0 0 0 0 rgba(201,147,58,.6)}50%{box-shadow:0 0 0 7px rgba(201,147,58,0)}}
  .tile.glow-red{border-color:var(--red);animation:cpr 1.6s infinite}
  .tile.glow-orange{border-color:var(--gold);animation:cpo 1.6s infinite}
  .tile .cdot{position:absolute;top:9px;right:9px;width:12px;height:12px;border-radius:50%;display:none;
    box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .tile.glow-red .cdot{display:block;background:var(--red)}
  .tile.glow-orange .cdot{display:block;background:var(--gold)}
  .cert-mem{border-bottom:1px solid var(--line)}
  .cert-mem-h{display:flex;align-items:center;gap:9px;padding:13px 12px;cursor:pointer;font-weight:800;
    font-size:15px;color:var(--ink);background:#f2f5fa}
  .cert-mem-h .car{width:16px;height:16px;stroke:var(--navy);fill:none;stroke-width:2.4;transition:transform .15s}
  .cert-mem.collapsed .car{transform:rotate(-90deg)}
  .cert-mem.collapsed .cert-list{display:none}
  .cert-badge-dot{width:11px;height:11px;border-radius:50%;margin-left:auto;flex:0 0 auto}
  .cert-list{padding:2px 0}
  .cert-row{display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid var(--line);
    border-left:4px solid var(--line)}
  .cert-row.expired{border-left-color:var(--red);background:rgba(200,32,46,.05)}
  .cert-row.soon{border-left-color:var(--gold);background:rgba(201,147,58,.07)}
  .cert-row.ok{border-left-color:#2f9e44}
  .cert-row.na,.cert-row.none{border-left-color:#c3ccda}
  .cert-main{flex:1;min-width:0}
  .cert-nm{font-weight:600;font-size:15px;color:var(--ink);line-height:1.25}
  .cert-num{font-size:12px;color:var(--mut);margin-top:2px}

  /* Directory */
  .dir-chips{display:flex;gap:7px;padding:10px 12px;overflow-x:auto;border-bottom:1px solid var(--line);background:#fff;-webkit-overflow-scrolling:touch}
  .dir-chip{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;
    font-size:12.5px;padding:6px 13px;border-radius:999px;cursor:pointer;flex:0 0 auto}
  .dir-chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .dir-card{padding:13px 12px;border-bottom:1px solid var(--line)}
  .dir-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .dir-nm{font-weight:700;font-size:16px;color:var(--ink)}
  .dir-badge{font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--navy);
    background:#eaf0f9;padding:2px 8px;border-radius:6px}
  .dir-unit{font-size:12.5px;color:var(--mut);font-weight:600}
  .dir-act{display:flex;gap:9px;margin-top:10px;flex-wrap:wrap}
  .dir-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);
    border-radius:11px;padding:10px 13px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
  .dir-btn svg{width:17px;height:17px;flex:0 0 auto}
  .dir-btn.call{border-color:#1e5fae;color:#1e5fae}
  .dir-btn.call svg{stroke:#1e5fae;fill:none;stroke-width:2}
  .dir-btn.map{flex:1;min-width:0}
  .dir-btn.map svg{stroke:#2f9e44;fill:none;stroke-width:2}
  .dir-btn.map span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cert-st{font-size:12.5px;font-weight:700;margin-top:3px}
  .cert-row.expired .cert-st{color:var(--red)}
  .cert-row.soon .cert-st{color:#b57c1e}
  .cert-row.ok .cert-st{color:#2f9e44}
  .cert-row.na .cert-st,.cert-row.none .cert-st{color:var(--mut)}
  .cert-cal{flex:0 0 auto;border:1px solid var(--navy);background:#fff;color:var(--navy);font-weight:700;
    font-size:12px;padding:7px 11px;border-radius:9px;cursor:pointer}
  .cert-legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 12px;font-size:12px;color:var(--mut);
    border-bottom:1px solid var(--line);background:#fff}
  .cert-legend span{display:flex;align-items:center;gap:5px}
  .cert-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
  @media print{
    body>*{display:none !important}
    #printArea{display:block !important}
    #printArea h2{font-size:18px;margin:0 0 4px}
    #printArea .pc{font-weight:bold;margin:12px 0 4px;border-bottom:1px solid #000}
    #printArea table{width:100%;border-collapse:collapse;font-size:11px}
    #printArea td,#printArea th{border:1px solid #999;padding:3px 5px;text-align:left;vertical-align:top}
  }
  .tile .lab{font-size:16px;font-weight:700;line-height:1.15;margin-top:2px}
  .tile .adm{margin-top:2px;font-size:10px;font-weight:700;
    letter-spacing:.5px;text-transform:uppercase;color:var(--gold)}

  .gate{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,var(--navy),var(--navy-d));
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;color:#fff;text-align:center}
  .gate .logo{width:96px;height:96px;border-radius:24px;background:#fff;
    display:flex;align-items:center;justify-content:center;margin-bottom:18px;overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .gate .logo img{width:84px;height:84px;object-fit:contain}
  .gate h1{font-size:20px;margin:0 0 4px}
  .gate p{margin:0 0 22px;opacity:.8;font-size:14px}
  .gate .box{width:100%;max-width:320px}
  .gate input{width:100%;border:0;border-radius:13px;padding:15px;font-size:16px;
    text-align:center;color:var(--ink);margin-bottom:10px}
  .gate button{width:100%;border:0;border-radius:13px;padding:15px;font-size:16px;
    font-weight:700;background:var(--gold);color:#3a2708;cursor:pointer}
  .gate .err{min-height:20px;color:#ffd7d7;font-size:13px;margin-top:10px}
  .gate .load{opacity:.7;font-size:13px;margin-top:14px}

  .signout{display:block;margin:6px auto 26px;background:none;border:0;
    color:var(--mut);font-size:13px;text-decoration:underline;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:#0e2c56;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:80}
  .toast.show{opacity:1;transform:translateX(-50%)}

  .installbar{display:none;align-items:center;gap:10px;margin:12px 12px 0;padding:11px 12px;
    background:#eaf0f9;border:1px solid #cddcf1;border-radius:13px;color:var(--navy)}
  .installbar.show{display:flex}
  .installbar .ib-ic{width:34px;height:34px;border-radius:9px;background:#fff;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .installbar .ib-ic img{width:30px;height:30px;object-fit:contain}
  .installbar .ib-tx{flex:1;font-size:13px;line-height:1.25}
  .installbar .ib-tx b{display:block;font-size:14px}
  .installbar .ib-go{border:0;background:var(--navy);color:#fff;font-weight:700;font-size:13px;
    border-radius:9px;padding:9px 13px;cursor:pointer;flex:0 0 auto}
  .installbar .ib-x{border:0;background:none;color:var(--mut);font-size:20px;line-height:1;
    padding:2px 4px;cursor:pointer;flex:0 0 auto}

  /* ---------- Screen (sub-page) ---------- */
  .screen{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;
    transform:translateX(100%);transition:transform .22s ease;visibility:hidden}
  .screen.open{transform:translateX(0);visibility:visible}
  .scr-head{position:sticky;top:0;background:linear-gradient(180deg,var(--navy),var(--navy-d));
    color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 10px 10px;
    display:flex;align-items:center;gap:6px;box-shadow:0 2px 10px rgba(9,26,52,.25)}
  .scr-head .back{border:0;background:rgba(255,255,255,.14);color:#fff;font-size:15px;font-weight:600;
    border-radius:10px;padding:9px 12px 9px 8px;cursor:pointer;display:flex;align-items:center;gap:3px}
  .scr-head .back svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.4}
  .scr-head h2{font-size:17px;margin:0;font-weight:700}
  .scr-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 30px}
  .scr-search{padding:10px 12px 2px;position:relative;z-index:20}
  .scr-search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;
    padding:12px 14px;font-size:16px;color:var(--ink);box-shadow:var(--shadow)}
  .scr-search input:focus{outline:none;border-color:var(--navy)}

  /* Hospital card */
  .hcard{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;
    box-shadow:var(--shadow);overflow:hidden}
  .hcard-top{padding:14px 14px;cursor:pointer;display:flex;align-items:flex-start;gap:10px}
  .hcard-top .nm{flex:1}
  .hcard-top .nm b{font-size:16px;line-height:1.2;display:block}
  .hcard-top .chev{width:20px;height:20px;stroke:var(--mut);fill:none;stroke-width:2;
    flex:0 0 auto;margin-top:2px;transition:transform .18s}
  .hcard.open .hcard-top .chev{transform:rotate(180deg)}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;background:#eaf0f9;color:var(--navy)}
  .tag.tr{background:#fdeaea;color:var(--red)}
  .tag.pe{background:#eafaf1;color:#1a7a48}
  .hcard-body{display:none;padding:0 14px 14px;border-top:1px solid var(--line);margin-top:2px}
  .hcard.open .hcard-body{display:block}
  .hrow{display:flex;gap:9px;margin-top:12px}
  .hbtn{flex:1;border:0;border-radius:11px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;color:#fff}
  .hbtn svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2}
  .hbtn.call{background:#1a7a48}
  .hbtn.nav{background:#1e5fae}
  .hbtn.red{background:var(--red)}
  .hmeta{margin-top:12px;font-size:13px;color:var(--ink)}
  .hmeta div{margin-top:5px}
  .hmeta .k{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  .hmore{margin-top:10px;background:none;border:0;color:var(--navy);font-weight:700;font-size:13px;
    cursor:pointer;text-decoration:underline;padding:2px 0}
  .hmore-wrap{margin-top:8px}
  .empty{text-align:center;color:var(--mut);padding:40px 20px;font-size:14px}

  .fbar{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;
    padding:8px 12px 4px;scrollbar-width:none}
  .fbar::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);
    font-size:13px;font-weight:600;padding:7px 13px;border-radius:20px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.clr{color:var(--red);border-color:#f0c9cd;background:#fff;font-weight:700}
  .fcount{padding:6px 14px 0;font-size:12px;color:var(--mut)}

  /* Protocols list */
  .cathead{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
    color:var(--mut);margin:16px 4px 7px}
  .plist{display:flex;flex-direction:column;gap:8px}
  .pitem{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 14px;cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
  .pitem b{font-size:15px;font-weight:600;line-height:1.25;flex:1}
  .pitem .go{width:18px;height:18px;stroke:var(--mut);fill:none;stroke-width:2;flex:0 0 auto}
  .phit{font-size:12px;color:var(--mut);margin-top:3px;font-weight:400;display:block}
  /* Protocol reader */
  .preader{position:fixed;inset:0;z-index:45;background:var(--card);display:flex;flex-direction:column;
    transform:translateX(100%);transition:transform .22s ease;visibility:hidden}
  .preader.open{transform:translateX(0);visibility:visible}
  .pr-head-txt{min-width:0;flex:1;text-align:left}
  .pr-head-txt b{display:block;font-size:15px;font-weight:700;color:var(--navy);line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pr-head-txt small{font-size:12px;color:var(--mut)}
  .pr-body{flex:1;overflow:hidden;background:#5b6472;position:relative;touch-action:none}
  .pr-page{position:absolute;top:0;left:0;width:100%;transform-origin:0 0;will-change:transform}
  .pr-page img{width:100%;height:auto;display:block;background:#fff;
    -webkit-user-select:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
  .pr-hint{position:absolute;left:0;right:0;bottom:9px;text-align:center;font-size:11px;color:#fff;
    opacity:.72;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.55);transition:opacity .4s}
  .pr-hint.gone{opacity:0}
  .pr-nav{display:flex;gap:9px;padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);
    border-top:1px solid var(--line);background:#fff}
  .pr-nav button{flex:1;border:1px solid var(--line);background:#fff;color:var(--navy);
    font-weight:700;font-size:14px;border-radius:11px;padding:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:5px}
  .pr-nav button:disabled{opacity:.35}
  .pr-nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4}

  .searchwrap{position:relative;z-index:15}
  .sresults{position:absolute;left:12px;right:12px;top:100%;margin-top:6px;background:#fff;
    border:1px solid var(--line);border-radius:13px;box-shadow:0 10px 30px rgba(16,38,74,.16);
    max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
  .sresults.show{display:block}
  .sr-group{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);
    padding:10px 14px 4px}
  .sr-item{padding:11px 14px;cursor:pointer;border-top:1px solid #f0f2f6;display:flex;align-items:center;gap:9px}
  .sr-item:first-child{border-top:0}
  .sr-item .sic{width:26px;height:26px;border-radius:7px;background:#eaf0f9;color:var(--navy);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .sr-item .sic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
  .sr-item .st{flex:1;min-width:0}
  .sr-item .st b{font-size:14px;font-weight:600;display:block;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sr-item .st span{font-size:11px;color:var(--mut)}
  .sr-empty{padding:16px 14px;color:var(--mut);font-size:13px;text-align:center}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var SHEET_ID="1gM1ndlnuKvQK8JvM_STUyrG8XbAl0W5IQk10EQTF98o";
  var LS="hoh_member_v1";

  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
  function toast(m){var t=$("toast");t.textContent=m;t.className="toast show";
    setTimeout(function(){t.className="toast";},1600);}
  function r_(o,k){return String(o[k]==null?"":o[k]).trim();}
  function isX(v){v=String(v==null?"":v).trim().toLowerCase();return v==="x"||v==="yes"||v==="true"||v==="1";}

  // Minimal RFC-4180 CSV parser (handles quotes, commas, newlines in fields)
  function parseCSV(text){
    var rows=[],row=[],field="",i=0,inQ=false,ch;
    while(i<text.length){
      ch=text[i];
      if(inQ){
        if(ch==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inQ=false;i++;continue; }
        field+=ch;i++;continue;
      }
      if(ch==='"'){inQ=true;i++;continue;}
      if(ch===','){row.push(field);field="";i++;continue;}
      if(ch==="\r"){i++;continue;}
      if(ch==="\n"){row.push(field);field="";rows.push(row);row=[];i++;continue;}
      field+=ch;i++;
    }
    // last field/row
    if(field!==""||row.length){ row.push(field); rows.push(row); }
    return rows;
  }

  function fetchTab(name){
    var url="https://docs.google.com/spreadsheets/d/"+SHEET_ID+
            "/gviz/tq?tqx=out:csv&sheet="+encodeURIComponent(name)+"&t="+Date.now();
    return fetch(url,{cache:"no-store"}).then(function(r){return r.text();}).then(function(t){
      var rows=parseCSV(t);
      if(!rows.length) return [];
      var keys=rows[0].map(function(k){return String(k==null?"":k).trim();});
      var out=[];
      for(var i=1;i<rows.length;i++){
        var c=rows[i],o={},any=false;
        for(var j=0;j<keys.length;j++){
          if(!keys[j]) continue;
          var v=c[j]!=null?String(c[j]).trim():"";
          o[keys[j]]=v; if(v) any=true;
        }
        if(any) out.push(o);   // skip fully blank rows
      }
      return out;
    });
  }

  var STATE={settings:{},tiles:[],me:null};
  function getSetting(k,def){return STATE.settings[k]!=null&&STATE.settings[k]!==""?STATE.settings[k]:def;}

  function tryLogin(pw){
    $("pwErr").textContent=""; $("pwLoad").classList.remove("hidden");
    return fetchTab("Members").then(function(rows){
      var hit=null;
      for(var i=0;i<rows.length;i++){
        var r=rows[i];
        var active=String(r["Active"]||"").trim().toLowerCase();
        if(!(active===""||active==="x"||active==="yes"||active==="true")) continue;
        if(String(r["Password"]||"").trim()===pw.trim()){ hit=r; break; }
      }
      $("pwLoad").classList.add("hidden");
      if(!hit){ $("pwErr").textContent="Password not recognized. Check with your coordinator."; return false; }
      var me={last:r_(hit,"Last Name"),first:r_(hit,"First Name"),unit:r_(hit,"Unit"),admin:isX(hit["Admin"]),status:r_(hit,"Status"),pw:pw.trim()};
      localStorage.setItem(LS,JSON.stringify(me)); STATE.me=me; return true;
    }).catch(function(){
      $("pwLoad").classList.add("hidden");
      $("pwErr").textContent="Couldn't reach the roster. Check your internet and try again."; return false;
    });
  }

  var ICONS={
    clipboard:'<path d="M9 3h6a1 1 0 011 1v1H8V4a1 1 0 011-1z"/><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 11h6M9 15h4"/>',
    hospital:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 8v8M8 12h8"/>',
    book:'<path d="M5 5a2 2 0 012-2h11v16H7a2 2 0 00-2 2z"/><path d="M5 19a2 2 0 012-2h11"/>',
    grid:'<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>',
    check:'<path d="M20 6L9 17l-5-5"/>',
    link:'<path d="M10 14a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1"/><path d="M14 10a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/>'
  };
  function icon(n){return ICONS[n]||ICONS.link;}

  function boot(){
    return Promise.all([fetchTab("Settings"),fetchTab("Tiles"),fetchTab("Members")]).then(function(res){
      STATE.settings={};
      res[0].forEach(function(r){var k=r_(r,"Setting");if(k)STATE.settings[k]=String(r["Value"]==null?"":r["Value"]).trim();});
      STATE.tiles=res[1].filter(function(t){
        if(!r_(t,"Label")) return false;
        var a=String(t["Active"]||"").trim().toLowerCase();
        return a===""||a==="x"||a==="yes"||a==="true";
      }).sort(function(a,b){return (parseFloat(a["Order"])||99)-(parseFloat(b["Order"])||99);});
      // Refresh the logged-in member from the roster so status/admin/unit changes in the
      // sheet take effect on next open (no need to sign out and back in).
      if(STATE.me&&STATE.me.pw){
        var rows=res[2]||[], mp=String(STATE.me.pw).trim(), found=null;
        for(var i=0;i<rows.length;i++){
          if(String(rows[i]["Password"]||"").trim()===mp){ found=rows[i]; break; }
        }
        var act=found?String(found["Active"]||"").trim().toLowerCase():"";
        var stillActive=found&&(act===""||act==="x"||act==="yes"||act==="true");
        if(!stillActive){
          try{localStorage.removeItem(LS);}catch(e){}
          STATE.me=null;
          $("app").classList.add("hidden");
          $("gate").classList.remove("hidden");
          if($("pwErr")) $("pwErr").textContent="Your access has been deactivated. Contact your coordinator.";
          return;
        }
        var h=found;
        STATE.me.status=r_(h,"Status");
        STATE.me.admin=isX(h["Admin"]);
        STATE.me.unit=r_(h,"Unit")||STATE.me.unit;
        STATE.me.first=r_(h,"First Name")||STATE.me.first;
        STATE.me.last=r_(h,"Last Name")||STATE.me.last;
        try{localStorage.setItem(LS,JSON.stringify(STATE.me));}catch(e){}
      }
      paintHeader(); paintTiles(); loadCerts();
      try{ if(window.gtag && STATE.me && STATE.me.unit){ gtag('set',{user_id:STATE.me.unit}); gtag('set','user_properties',{unit:STATE.me.unit,role:(STATE.me.admin?"admin":"member")}); } }catch(e){}
    });
  }
  function paintHeader(){
    $("unit").textContent=STATE.me.unit||"—";
    $("mcLabel").textContent=getSetting("Medical Control Label","Medical Control");
    $("dispLabel").textContent=getSetting("Dispatch Label","Dispatch");
    $("gateOrg").textContent=getSetting("Org Name","Hatzalah of Houston");
    $("search").placeholder=getSetting("Search Placeholder","Search…");
    var el=$("rstatus"), st=(STATE.me&&STATE.me.status?String(STATE.me.status):"").trim();
    var key=st.toLowerCase();
    el.className="rstatus";
    if(!st){ el.classList.add("hidden"); el.innerHTML=""; }
    else{
      el.classList.add(key==="primary"||key==="backup"||key==="observer"?key:"observer");
      var label=st.charAt(0).toUpperCase()+st.slice(1).toLowerCase();
      el.innerHTML='<span class="dot"></span>'+esc(label);
    }
  }
  function paintTiles(){
    var g=$("grid");g.innerHTML="";
    STATE.tiles.forEach(function(t){
      var adminOnly=isX(t["Admin Only"]);
      if(adminOnly&&!STATE.me.admin) return;
      var b=document.createElement("button");b.className="tile";
      b.setAttribute("data-type",(r_(t,"Type")||"").toLowerCase());
      var img=r_(t,"Image URL")||r_(t,"Image")||"";
      var iconTile=function(){
        b.className="tile";
        b.innerHTML='<div class="ic"><svg viewBox="0 0 24 24">'+icon(r_(t,"Icon"))+'</svg></div>'+
                    '<div class="lab">'+esc(r_(t,"Label"))+'</div>'+
                    (adminOnly?'<div class="adm">Admin</div>':'');
      };
      if(img){
        b.className="tile imgtile";
        b.innerHTML='<img class="bg" src="'+esc(img)+'" alt="">'+
                    '<div class="lab">'+esc(r_(t,"Label"))+'</div>'+
                    (adminOnly?'<div class="adm">Admin</div>':'');
        var im=b.querySelector("img.bg");
        if(im) im.onerror=iconTile;   // broken image -> fall back to the built-in icon
      }else{ iconTile(); }
      b.addEventListener("click",function(){openTile(t);});
      g.appendChild(b);
    });
  }
  var APPS={
    pulsara:{
      name:"Pulsara",
      androidPkg:"com.pulsara.stopapps",
      androidStore:"https://play.google.com/store/apps/details?id=com.pulsara.stopapps",
      iosStore:"https://apps.apple.com/us/app/pulsara-medical-communication/id873184192"
    }
  };
  function launchApp(key){
    key=String(key||"").trim();
    // A raw deep link / scheme typed straight into the Target column is tried directly
    // (e.g. "pulsara://"). Handy for testing what actually opens the app.
    if(key.indexOf("://")>-1){ window.location.href=key; return; }
    var a=APPS[key.toLowerCase()];
    if(!a){ toast("App not set up yet."); return; }
    var ua=navigator.userAgent||"";
    var isIOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
    var isAndroid=/Android/.test(ua);
    if(isAndroid&&a.androidPkg){
      window.location.href="intent://#Intent;action=android.intent.action.MAIN;"+
        "category=android.intent.category.LAUNCHER;package="+a.androidPkg+
        ";S.browser_fallback_url="+encodeURIComponent(a.androidStore||"")+";end";
    }else if(isIOS){
      window.location.href=a.iosStore||a.androidStore||"";
    }else{
      window.open(a.androidStore||a.iosStore||"","_blank","noopener");
    }
  }
  // ---- Hardware/Back-button navigation: Back closes the top screen, exits only at home ----
  var navStack=[];
  function navOpen(closeFn){ navStack.push(closeFn); try{ history.pushState({hoh:navStack.length},""); }catch(e){} }
  function navBack(){ if(navStack.length){ try{ history.back(); }catch(e){ var f=navStack.pop(); if(f) f(); } } }
  window.addEventListener("popstate",function(){ if(navStack.length){ var f=navStack.pop(); if(f) f(); } });

  function openTile(t){
    var type=r_(t,"Type").toLowerCase();
    try{ if(window.gtag) gtag('event','tile_tap',{ tile_label:r_(t,"Label")||"", tile_type:type||"", member_unit:(STATE.me&&STATE.me.unit)||"" }); }catch(e){}
    if(type==="link"){var u=r_(t,"Target");if(!u){toast("No link set for this tile.");return;} if(/^(tel:|mailto:)/i.test(u)){location.href=u;}else{window.open(u,"_blank","noopener");} return;}
    if(type==="hospitals"){ openHospitals(); return; }
    if(type==="protocols"){ openProtocols(); return; }
    if(type==="app"){ launchApp(r_(t,"Target")); return; }
    if(type==="placement"||type==="product"){ openPlacement(); return; }
    if(type==="equipment"||type==="checklist"){ openEquipFrame(); return; }
    if(type==="upload"||type==="fileupload"){ openUpload(r_(t,"Target")); return; }
    if(type==="certifications"||type==="certs"){ openCerts(); return; }
    if(type==="directory"||type==="members"||type==="contacts"){ openDirectory(); return; }
    toast('"'+r_(t,"Label")+'" is being added next.');
  }

  // ---------- Equipment Finder (cabinet look-up + admin editor) ----------
  var PLACE={loaded:false,cabs:[],cur:null,sel:-1,edit:false,drag:null,editIdx:-1};
  function clampf(v,a,b){ return v<a?a:(v>b?b:v); }
  function isAdmin(){ return !!(STATE.me&&STATE.me.admin); }
  function loadPlacement(){
    return new Promise(function(res,rej){
      if(window.HOH_PLACE){ res(window.HOH_PLACE); return; }
      var s=document.createElement("script"); s.src="placement.js";
      s.onload=function(){ window.HOH_PLACE?res(window.HOH_PLACE):rej(); };
      s.onerror=rej; document.head.appendChild(s);
    });
  }
  function closePlaceScreen(){ $("placeScreen").classList.remove("open"); }
  function openPlacement(){
    if(!$("placeScreen").classList.contains("open")) navOpen(closePlaceScreen);
    $("placeScreen").classList.add("open");
    $("placeSearch").value=""; $("placeSres").className="sresults"; $("placeSres").innerHTML="";
    $("placeEdit").classList.toggle("hidden",!isAdmin());
    if(PLACE.loaded){ return; }
    $("cabGrid").innerHTML='<div class="empty">Loading\u2026</div>';
    loadPlacement().then(function(d){ PLACE.cabs=d||[]; PLACE.loaded=true; renderCabGrid(); })
      .catch(function(){ $("cabGrid").innerHTML='<div class="empty">Couldn\'t load. Check your internet and open this again.</div>'; });
  }
  function setHomeEdit(on){
    PLACE.edit=on;
    $("placeEdit").classList.toggle("on",on);
    $("placeEdit").textContent=on?"Done":"Edit";
    $("cabHomeBar").classList.toggle("hidden",!on);
    renderCabGrid();
  }
  function renderCabGrid(){
    var g=$("cabGrid"); g.innerHTML="";
    if(!PLACE.cabs.length){ g.innerHTML='<div class="empty">No cabinets yet.'+(isAdmin()?' Tap Edit to add one.':'')+'</div>'; return; }
    PLACE.cabs.forEach(function(c){
      var d=document.createElement("div"); d.className="cab-card";
      var thumb=c._img||c.img||"";
      d.innerHTML='<img src="'+esc(thumb)+'" alt=""><div style="flex:1"><div class="cc-nm">'+esc(c.name)+
        '</div><div class="cc-ct">'+c.bins.length+' item'+(c.bins.length===1?'':'s')+
        (c.img||c._img?'':' \u00B7 no photo')+'</div></div>'+
        (PLACE.edit?'<div class="cab-ord"><button class="ebtn ord" data-up="'+esc(c.id)+'" title="Move up">\u25B2</button>'+
          '<button class="ebtn ord" data-down="'+esc(c.id)+'" title="Move down">\u25BC</button>'+
          '<button class="ebtn danger" data-del="'+esc(c.id)+'">Delete</button></div>':'');
      d.addEventListener("click",function(e){
        var t=e.target;
        if(t.getAttribute){
          if(t.getAttribute("data-del")){ delCabinet(c.id); return; }
          if(t.getAttribute("data-up")){ moveCab(c.id,-1); return; }
          if(t.getAttribute("data-down")){ moveCab(c.id,1); return; }
        }
        openCab(c.id);
      });
      g.appendChild(d);
    });
  }
  function newId(){ return "C"+Date.now().toString(36); }
  function addCabinet(){
    var nm=prompt("Cabinet name (e.g. Airway, Meds, Trauma):","");
    if(!nm) return; nm=nm.trim(); if(!nm) return;
    PLACE.cabs.push({id:newId(),name:nm,img:"",bins:[]});
    renderCabGrid();
    toast("Added \u201C"+nm+"\u201D. Open it to add a photo and items.");
  }
  function delCabinet(id){
    var c=cabById(id); if(!c) return;
    if(!confirm("Delete cabinet \u201C"+c.name+"\u201D and all its items?")) return;
    PLACE.cabs=PLACE.cabs.filter(function(x){return x.id!==id;});
    renderCabGrid();
  }
  function moveCab(id,dir){
    var i=-1; for(var k=0;k<PLACE.cabs.length;k++){ if(PLACE.cabs[k].id===id){ i=k; break; } }
    if(i<0) return; var j=i+dir; if(j<0||j>=PLACE.cabs.length) return;
    var tmp=PLACE.cabs[i]; PLACE.cabs[i]=PLACE.cabs[j]; PLACE.cabs[j]=tmp;
    renderCabGrid();
  }
  function cabById(id){ for(var i=0;i<PLACE.cabs.length;i++) if(PLACE.cabs[i].id===id) return PLACE.cabs[i]; return null; }

  function openCab(id){
    var c=cabById(id); if(!c) return;
    PLACE.cur=c; PLACE.sel=-1;
    $("cabName").textContent=c.name;
    $("cabSearch").value="";
    $("cabEdit").classList.toggle("hidden",!isAdmin());
    setCabEdit(false);
    drawCab();
    $("cabPhotoWrap").scrollTop=0; $("cabPhotoWrap").scrollLeft=0;
    if(!$("placeDetail").classList.contains("open")) navOpen(closeCab);
    $("placeDetail").classList.add("open");
  }
  function closeCab(){ $("placeDetail").classList.remove("open"); setHomeEdit(false); }
  function drawCab(){
    var c=PLACE.cur; if(!c) return;
    var src=c._img||c.img||"";
    var boxes="";
    c.bins.forEach(function(b,k){
      boxes+='<div class="cbin" data-i="'+k+'" style="left:'+(b.x*100)+'%;top:'+(b.y*100)+
        '%;width:'+(b.w*100)+'%;height:'+(b.h*100)+'%"><span class="cbadge">'+(k+1)+
        '</span><span class="cchip">'+esc(b.n)+'</span><span class="rsz" data-rsz="'+k+'"></span></div>';
    });
    var ph=$("cabPhoto");
    ph.innerHTML=(src?'<img id="cabImg" src="'+esc(src)+'" alt="">':'')+boxes;
    if(!src){ ph.insertAdjacentHTML("afterbegin",'<div class="empty" style="color:#fff;padding:30px">No photo yet'+(isAdmin()?' \u2014 tap Edit, then Replace photo.':'.')+'</div>'); }
    renderCabItems("");
  }
  function renderCabItems(q){
    var c=PLACE.cur; if(!c) return;
    q=(q||"").toLowerCase().trim();
    var L=$("cabList"); L.innerHTML="";
    c.bins.forEach(function(b,k){
      if(q && b.n.toLowerCase().indexOf(q)<0) return;
      var r=document.createElement("div");
      r.className="cirow"+(PLACE.sel===k?" sel":""); r.setAttribute("data-i",k);
      r.innerHTML='<span class="cinum">'+(k+1)+'</span><span class="ciname">'+esc(b.n)+'</span>'+
        (b.q?'<span class="ciqty">\u00D7'+esc(b.q)+'</span>':'')+
        (PLACE.edit?'<span class="ciqty" style="color:var(--navy)">Edit \u203A</span>':'');
      r.addEventListener("click",function(){ if(PLACE.edit) openItemEdit(k); else selectSlot(k,true); });
      L.appendChild(r);
    });
    if(!L.childNodes.length) L.innerHTML='<div class="empty">'+(q?'No item matches \u201C'+esc(q)+'\u201D.':'No items yet.')+'</div>';
  }
  function selectSlot(k,fromList){
    PLACE.sel=k;
    var ph=$("cabPhoto");
    ph.querySelectorAll(".cbin").forEach(function(el){ el.classList.toggle("sel", parseInt(el.getAttribute("data-i"),10)===k); });
    var box=ph.querySelector('.cbin[data-i="'+k+'"]');
    if(box && !fromList){}
    if(box){ var wrap=$("cabPhotoWrap"), br=box.getBoundingClientRect(), wr=wrap.getBoundingClientRect();
      wrap.scrollTop += (br.top-wr.top)-wr.height/2+br.height/2;
      wrap.scrollLeft += (br.left-wr.left)-wr.width/2+br.width/2; }
    $("cabList").querySelectorAll(".cirow").forEach(function(el){ el.classList.toggle("sel", parseInt(el.getAttribute("data-i"),10)===k); });
    if(!fromList){ var row=$("cabList").querySelector('.cirow[data-i="'+k+'"]'); if(row) row.scrollIntoView({block:"nearest"}); }
  }
  function setCabEdit(on){
    PLACE.edit=on;
    $("cabEdit").classList.toggle("on",on);
    $("cabEdit").textContent=on?"Done":"Edit";
    $("cabEditBar").classList.toggle("hidden",!on);

  function parseCertDate(s){
    s=String(s||"");
    var m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
    if(m){ var mo=+m[1],da=+m[2],yr=+m[3]; if(yr<100) yr+=2000; var d=new Date(yr,mo-1,da); if(!isNaN(d)) return d; }
    m=s.match(/(\d{4})-(\d{2})-(\d{2})/);
    if(m){ var d2=new Date(+m[1],+m[2]-1,+m[3]); if(!isNaN(d2)) return d2; }
    return null;
  }
  function fmtDate(d){ return (d.getMonth()+1)+"/"+d.getDate()+"/"+d.getFullYear(); }
  function certStatus(val){
    val=String(val||"").trim();
    if(!val) return {k:"none",label:"No expiration on file"};
    var d=parseCertDate(val);
    if(d){
      var today=new Date(); today.setHours(0,0,0,0);
      var days=Math.round((d-today)/86400000);
      if(days<0) return {k:"expired",label:"Expired "+fmtDate(d),date:d};
      if(days<=30) return {k:"soon",label:"Expires "+fmtDate(d)+" ("+days+" days)",date:d};
      return {k:"ok",label:"Valid \u2014 exp "+fmtDate(d),date:d};
    }
    var low=val.toLowerCase();
    if(low.indexOf("missing")>-1) return {k:"expired",label:"Missing"};
    if(low==="n/a"||low==="na") return {k:"na",label:"N/A"};
    if(low==="yes"||low.indexOf("complete")>-1||low==="done") return {k:"ok",label:val};
    return {k:"na",label:val};

      else if(/ #$/.test(k)){ base=k.replace(/ #$/,""); field="num"; }
      else { base=k; field="single"; }
      if(!map[base]){ map[base]={name:base}; bases.push(base); }
      if(field==="exp") map[base].expKey=k;

  // Reader = real book pages, flips through the whole book, with pinch/pan/double-tap zoom.

  function pzApply(){
    // clamp translation so the page can't be dragged off into empty space
    var dW=PZ.iw*PZ.scale, dH=PZ.ih*PZ.scale;
    if(dW<=PZ.cw) PZ.tx=(PZ.cw-dW)/2; else PZ.tx=Math.min(0,Math.max(PZ.cw-dW,PZ.tx));
    if(dH<=PZ.ch) PZ.ty=(PZ.ch-dH)/2; else PZ.ty=Math.min(0,Math.max(PZ.ch-dH,PZ.ty));

  }
  function pzMeasure(){
    PZ.cw=prBody.clientWidth; PZ.ch=prBody.clientHeight;

      if(deferred){
        deferred.prompt();
        deferred.userChoice.then(function(){ deferred=null; hideBar(); });
      }else if(isIOS()){
        sub.textContent="Tap the Share button, then \u201CAdd to Home Screen.\u201D";
        go.style.display="none";
      }
    });

    // Once installed, hide immediately and it won't come back (standalone check)
    window.addEventListener("appinstalled", hideBar);

    // iOS never fires beforeinstallprompt: show manual steps each visit until installed
    if(isIOS() && !standalone()){
      sub.textContent="Tap Share, then \u201CAdd to Home Screen.\u201D";
      go.style.display="none";
      showBar();
    }
  })();

  // ---- PWA service worker ----
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
